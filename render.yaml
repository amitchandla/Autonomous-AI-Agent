# render.yaml
# Render "Blueprint" — lets you deploy this backend by pointing Render at
# the repo root and clicking "New Blueprint Instance" instead of clicking
# through every setting by hand. See PHASE5_DEPLOYMENT.md for the full walkthrough.

services:
  - type: web
    name: autotube-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # avoid the free tier for this service — see deployment notes on spin-down
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false # set to https://your-frontend-domain.com/api/youtube/callback
      - key: LOCAL_RENDER_DIR
        value: ./rendered_videos
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false" # Supabase Cron / Vercel Cron drives this in production
      - key: CRON_SECRET
        sync: false
      - key: SCHEDULER_POLL_SECONDS
        value: "60"
